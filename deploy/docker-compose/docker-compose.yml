version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ftgo-postgres
    environment:
      POSTGRES_USER: ftgo
      POSTGRES_PASSWORD: ftgo
      POSTGRES_DB: ftgo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ftgo-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ftgo
      RABBITMQ_DEFAULT_PASS: ftgo
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  postgres-data:
  rabbitmq-data:
