[project]
name = "api-gateway"
version = "0.1.0"
description = "FTGO API gateway"
requires-python = ">=3.12"
dependencies = [
  "common",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
]

[tool.uv.sources]
common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_gateway"]
